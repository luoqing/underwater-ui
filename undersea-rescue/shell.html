<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#062a30"><title>海底救援</title><style>/*STYLE*/</style></head><body>
<main id="menu"><div class="brand"><i></i> 深海观测站</div><div class="intro"><p class="eyebrow">UNDERSEA RESCUE</p><h1>海底救援</h1><p class="lead">潜入珊瑚花园，沿沙道游向水母湾与鲸游峡口。</p><div id="missions"><button data-story="route"><small>语音救援航线</small><strong>沿鲸歌去救援 <b>↗</b></strong><span>从珊瑚花园一路潜泳，护送幼鲸、救出蝠鲼</span></button><button data-story="roam"><small>第一人称潜水</small><strong>潜入珊瑚花园 <b>↗</b></strong><span>自由游动，探索整片海域</span></button><button data-story="whale"><small>单项练习 · 水听器</small><strong>雾里的鲸歌 <b>↗</b></strong><span>辨认回声，带幼鲸穿过横流</span></button><button data-story="manta"><small>单项练习 · 打捞</small><strong>沉笼之下 <b>↗</b></strong><span>托起横梁，为蝠鲼打开通道</span></button><button data-story="observe"><small>自由观察</small><strong>峡谷鱼类图鉴 <b>↗</b></strong><span>近看六种海鱼的体形与游姿</span></button></div><p id="load" role="status">正在准备海域…</p></div></main>
<section id="dive" hidden aria-label="潮汐峡谷潜航"><div id="view"></div><output id="render-stats" hidden aria-label="渲染性能"></output><header><div><small>潮汐峡谷</small><strong id="mission"></strong></div><nav><button id="roam-toggle">自由潜水</button><button id="audio">声音 开</button><button id="exit">返回海图</button></nav></header><div id="location"></div><div id="dive-hud" hidden><div class="depth-line"><span id="reef-zone"></span><span id="dive-readout"></span></div><div class="swim-caption"><p id="swim-tip" hidden><span>WASD 游动 · 拖动转向 · 空格上浮 · Q 下潜</span><span class="touch-help">左手摇杆游动，右手滑动转向</span></p><button id="face-target" type="button" title="转向当前救援目标" aria-description="点按可转向目标" hidden><span id="route-guide"></span> <span aria-hidden="true">◎</span></button></div><div id="touch-swim" aria-label="潜水控制"><div id="swim-stick" role="group" aria-label="潜水移动摇杆"><i></i></div><div class="depth-controls"><button data-key="KeyE">上浮</button><button data-key="KeyQ">下潜</button></div></div></div><article id="panel"><small id="phase"></small><h2 id="objective"></h2><p id="narrative"></p><div id="controls"></div><div id="feedback" role="status" aria-live="polite"></div></article></section>
<script>/*SCRIPT*/</script></body></html>
